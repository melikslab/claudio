name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Versión de Swift
        run: swift --version
      - name: Compilar y empaquetar (Apple Silicon)
        run: ./build-app.sh
      - name: Compilar y empaquetar (Intel, aparte)
        run: ./build-app.sh --intel
      - name: Comprobar el arranque en modo depuración
        run: build/Claudio.app/Contents/MacOS/Claudio --dump
      - name: Crear los instaladores DMG
        run: |
          scripts/make-dmg.sh
          scripts/make-dmg.sh --intel
      - uses: actions/upload-artifact@v4
        with:
          name: Claudio
          path: build/Claudio-*.dmg
