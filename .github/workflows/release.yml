name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Compilar y empaquetar (Apple Silicon e Intel por separado)
        run: |
          VERSION="${GITHUB_REF_NAME#v}" ./build-app.sh
          VERSION="${GITHUB_REF_NAME#v}" ./build-app.sh --intel
      - name: Comprimir
        run: |
          ditto -c -k --keepParent build/Claudio.app Claudio-AppleSilicon.zip
          ditto -c -k --keepParent build/intel/Claudio.app Claudio-Intel.zip
      - name: Publicar la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=$(awk -v v="${GITHUB_REF_NAME#v}" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md)
          gh release create "$GITHUB_REF_NAME" Claudio-AppleSilicon.zip Claudio-Intel.zip \
            --title "Claudio $GITHUB_REF_NAME" \
            --notes "$notes

          **Download:** \`Claudio-AppleSilicon.zip\` for Apple silicon Macs (M1 or later) or \`Claudio-Intel.zip\` for Intel Macs.

          **Install:** unzip, move Claudio.app to Applications and open it with right-click → Open (it isn't signed with an Apple certificate)."
