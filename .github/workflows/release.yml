name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Poner la versión de la etiqueta en Info.plist
        run: sed -i '' "s|<string>0.1.0</string>|<string>${GITHUB_REF_NAME#v}</string>|" build-app.sh
      - name: Compilar y empaquetar
        run: ./build-app.sh
      - name: Comprimir
        run: ditto -c -k --keepParent build/Claudio.app Claudio.zip
      - name: Publicar la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=$(awk -v v="${GITHUB_REF_NAME#v}" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md)
          gh release create "$GITHUB_REF_NAME" Claudio.zip \
            --title "Claudio $GITHUB_REF_NAME" \
            --notes "$notes

          **Instalación:** descomprime, mueve Claudio.app a Aplicaciones y ábrela con clic derecho → Abrir (no está firmada con un certificado de Apple)."
