name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Compilar y empaquetar (Apple Silicon e Intel por separado)
        run: |
          VERSION="${GITHUB_REF_NAME#v}" ./build-app.sh
          VERSION="${GITHUB_REF_NAME#v}" ./build-app.sh --intel
      - name: Crear los instaladores DMG
        run: |
          scripts/make-dmg.sh
          scripts/make-dmg.sh --intel
      - name: Publicar la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=$(awk -v v="${GITHUB_REF_NAME#v}" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md)
          gh release create "$GITHUB_REF_NAME" build/Claudio-AppleSilicon.dmg build/Claudio-Intel.dmg \
            --title "Claudio $GITHUB_REF_NAME" \
            --notes "$notes

          **Download:** \`Claudio-AppleSilicon.dmg\` for Apple silicon Macs (M1 or later) or \`Claudio-Intel.dmg\` for Intel Macs.

          **Install:** open the DMG, drag Claudio to Applications, then open it with right-click → Open the first time (it isn't signed with an Apple certificate)."
